[package]
name = "realine-core"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT OR Apache-2.0"
description = "Scoped, transport-independent realtime lifecycle and presence mechanics"
authors = ["Artem Prianishnikov <Pryanishnikovartem@gmail.com>"]
repository = "https://github.com/FrankFMY/realine-core"
homepage = "https://github.com/FrankFMY/realine-core"
documentation = "https://github.com/FrankFMY/realine-core/blob/main/API.md"
include = ["/src/**/*.rs", "/tests/**/*.rs", "/examples/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/API.md", "/BUILD.md", "/CORE_CONTRACT.md", "/LISTS_CONTRACT.md", "/WINDOW_CONTRACT.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/scripts/cargo.mjs", "/rust-toolchain.toml", "/LICENSE", "/LICENSE-MIT", "/LICENSE-APACHE", "/THIRD-PARTY-NOTICES.md", "/licenses/**"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.105"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev]
debug = 0
incremental = false
